[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "levanto"
version = "1.1.0"
description = "Typed Python client for the Levanto Sage decision API (v1.1)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Levanto Labs", email = "team@levanto.ai" }]
keywords = ["levanto", "sage", "llm", "classification", "decision", "api"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.25"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "jsonschema>=4.21"]

[project.urls]
Documentation = "https://docs.levanto.ai"
Homepage = "https://github.com/levantolabs/levanto-py"
Source = "https://github.com/levantolabs/levanto-py"
Issues = "https://github.com/levantolabs/levanto-py/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/levanto"]

[tool.hatch.build.targets.sdist]
include = ["src/levanto", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = ["live: calls the real Sage API (needs LEVANTO_API_KEY)"]

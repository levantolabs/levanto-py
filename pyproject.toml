[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "levanto"
version = "0.1.0"
description = "Typed Python client for the Levanto Sage decision API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Levanto Labs", email = "team@levanto.ai" }]
keywords = ["levanto", "sage", "llm", "classification", "decision", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = ["httpx"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[project.urls]
Documentation = "https://docs.levanto.ai"
Homepage = "https://github.com/levantolabs/levanto-py"
Source = "https://github.com/levantolabs/levanto-py"
Issues = "https://github.com/levantolabs/levanto-py/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/levanto"]

[tool.hatch.build.targets.sdist]
include = ["src/levanto", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
